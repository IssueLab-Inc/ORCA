<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORCA motion / Integration</title><style>body{font:16px system-ui;color:#11161B;background:#F5F7F8;max-width:920px;margin:48px auto;padding:24px}section{padding:24px;margin:16px 0;background:white}button{font:inherit;padding:10px 16px;margin:12px 8px 0 0}h1{font-size:28px}orca-loader{margin-right:24px}.navy{background:#052640;color:white}</style><script type="module" src="orca-motion.js"></script><h1>ORCA / Native motion components</h1><section><orca-loader label="Loading models" show-label></orca-loader><orca-loader variant="breathe" label="Preparing model" size="48"></orca-loader><orca-loader variant="resolve" label="Checking geometry" size="48"></orca-loader></section><section><orca-phase id="phase" phase="observe" size="48"></orca-phase><div><button data-phase="observe">Observe</button><button data-phase="resolve">Resolve</button><button data-phase="check">Check</button><button data-phase="apply">Apply</button></div></section><section class="navy"><orca-reveal id="reveal" width="480"></orca-reveal><div><button id="replay">Replay reveal</button></div></section><section><orca-settle id="complete" size="64" label="Completed"></orca-settle><button id="finish">Complete action</button></section><script>document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>document.getElementById('phase').setAttribute('phase',b.dataset.phase));document.getElementById('replay').onclick=()=>document.getElementById('reveal').replay();document.getElementById('finish').onclick=()=>document.getElementById('complete').replay();</script></html>
